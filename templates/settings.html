{% extends "base.html" %}

{% block content %}

<div class="center-box">

    <h2>Profile Settings</h2>

    <!-- ================= PROFILE PICTURE PREVIEW ================= -->
    <div class="profile-preview">

        {% if settings and settings.profile_pic %}
            <img src="{{ url_for('static', filename='uploads/' + settings.profile_pic) }}"
                 class="profile-circle-img">
        {% else %}
            <div class="profile-circle-img default-avatar">
                {{ settings.name[0] if settings and settings.name else "U" }}
            </div>
        {% endif %}

    </div>

    <!-- ================= PROFILE UPDATE FORM ================= -->
    <form method="POST" enctype="multipart/form-data" class="create-form">

        <div class="form-group">
            <label>Change Profile Picture</label>
            <input type="file" name="profile_pic">
        </div>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name"
                   value="{{ settings.name if settings else '' }}">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email"
                   value="{{ settings.email if settings else '' }}">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone"
                   value="{{ settings.phone if settings else '' }}">
        </div>

        <div class="form-group">
            <label>Bio</label>
            <textarea name="bio" rows="3">
{{ settings.bio if settings else '' }}
            </textarea>
        </div>

        <!-- Private Toggle -->
        <div class="form-group toggle-group">
            <label class="toggle-label">
                <input type="checkbox" name="private"
                {% if settings and settings.is_private %}checked{% endif %}>
                <span class="slider"></span>
                Private Account
            </label>
        </div>

        <button type="submit" class="post-btn">
            Save Profile Changes
        </button>

    </form>

</div>


<!-- ================= PASSWORD SECTION ================= -->
<div class="center-box" style="margin-top:30px;">

    <h2>Change Password</h2>

    <form method="POST" action="/change_password" class="create-form">

        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" required>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" required>
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>
        </div>

        <button type="submit" class="post-btn">
            Update Password
        </button>

    </form>

</div>

{% endblock %}
